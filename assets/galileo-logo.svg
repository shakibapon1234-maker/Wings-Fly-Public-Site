<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0d8ff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" 
    font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="900" 
    fill="url(#glow)" letter-spacing="8" filter="url(#shadow)">
    GALILEO
  </text>
  <text x="50%" y="82%" dominant-baseline="middle" text-anchor="middle" 
    font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" 
    fill="rgba(255,255,255,0.85)" letter-spacing="6">
    BY TRAVELPORT
  </text>
</svg>
